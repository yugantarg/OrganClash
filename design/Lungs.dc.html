<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0e1b21; }
  </style>
</helmet>
<div style="width: 512px; height: 512px; background: radial-gradient(120% 120% at 50% 30%, #16303a 0%, #0e1b21 70%); display: flex; align-items: center; justify-content: center;">
  <svg width="440" height="440" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lLobe" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffb3be"/>
        <stop offset="55%" stop-color="#f27f92"/>
        <stop offset="100%" stop-color="#b65a86"/>
      </linearGradient>
      <linearGradient id="lTrachea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e7e2d4"/>
        <stop offset="100%" stop-color="#bcb49e"/>
      </linearGradient>
      <filter id="lShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="12"/>
      </filter>
    </defs>

    <ellipse cx="256" cy="452" rx="160" ry="30" fill="#000" opacity="0.28" filter="url(#lShadow)"/>

    <!-- trachea + bronchi -->
    <path d="M256 96 L256 210" fill="none" stroke="#8a7f5f" stroke-width="30" stroke-linecap="round"/>
    <path d="M256 96 L256 210" fill="none" stroke="url(#lTrachea)" stroke-width="20" stroke-linecap="round"/>
    <path d="M256 200 C230 226 214 250 206 286" fill="none" stroke="#8a7f5f" stroke-width="18" stroke-linecap="round"/>
    <path d="M256 200 C282 226 298 250 306 286" fill="none" stroke="#8a7f5f" stroke-width="18" stroke-linecap="round"/>
    <!-- cartilage rings -->
    <g stroke="#a99a72" stroke-width="5" opacity="0.8">
      <line x1="244" y1="120" x2="268" y2="120"/>
      <line x1="244" y1="140" x2="268" y2="140"/>
      <line x1="244" y1="160" x2="268" y2="160"/>
      <line x1="244" y1="180" x2="268" y2="180"/>
    </g>

    <!-- left lobe -->
    <path d="M232 196
             C150 200 108 268 112 344
             C114 396 150 430 196 430
             C226 430 236 408 236 372
             L236 214 C236 202 232 196 232 196 Z"
          fill="url(#lLobe)" stroke="#8a3a5a" stroke-width="11" stroke-linejoin="round"/>
    <!-- right lobe -->
    <path d="M280 196
             C362 200 404 268 400 344
             C398 396 362 430 316 430
             C286 430 276 408 276 372
             L276 214 C276 202 280 196 280 196 Z"
          fill="url(#lLobe)" stroke="#8a3a5a" stroke-width="11" stroke-linejoin="round"/>

    <!-- fissure detail -->
    <path d="M170 260 C150 300 152 350 180 386" fill="none" stroke="#c26a80" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <path d="M342 260 C362 300 360 350 332 386" fill="none" stroke="#c26a80" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

    <!-- rim light -->
    <path d="M388 300 C388 372 350 414 312 424" fill="none" stroke="#ffcdd6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- highlights -->
    <ellipse cx="150" cy="262" rx="34" ry="46" fill="#ffdbe1" opacity="0.45" transform="rotate(12 150 262)"/>
    <ellipse cx="196" cy="240" rx="30" ry="42" fill="#ffdbe1" opacity="0.35" transform="rotate(8 196 240)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
